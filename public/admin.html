<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->

<script>

  function gtag(){dataLayer.push(arguments);}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LumatoStreaming — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="admin.css">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-32.png">
</head>
<body class="admin-body">

<div class="admin-wrap">
  <div class="admin-topbar">
    <div class="logo">
      <img src="/icons/logo-mark.png" class="logo-img" alt="LumatoStreaming" />
          <div class="logo-text">LUMATO<span class="logo-accent">STREAMING</span></div>
      <span class="tag" style="color:#241706;background:var(--gold); margin-left:8px;">ADMIN</span>
    </div>
    <div class="admin-topbar-actions">
      <a href="/" class="btn btn-outline">Back to site</a>
      <div id="admin-user"></div>
    </div>
  </div>

  <div id="admin-gate" class="empty-state" hidden>Checking access…</div>

  <div id="admin-content" hidden>
    <div class="admin-head">
      <h1>Catalog</h1>
      <div style="display:flex; gap:10px;">
        <a href="/bulk-upload.html" class="btn btn-outline" style="text-decoration:none;">Bulk upload episodes</a>
        <div class="btn btn-outline" id="import-tmdb-btn">Import title</div>
        <div class="btn btn-gold" id="add-title-btn">Add title</div>
      </div>
    </div>
    <div class="admin-toolbar">
      <label class="admin-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input id="admin-search" type="search" placeholder="Search by title, genre or year…" autocomplete="off" />
      </label>
      <select id="admin-type-filter" class="admin-select" aria-label="Filter by type">
        <option value="">All types</option>
        <option value="movie">Movies</option>
        <option value="series">Shows</option>
      </select>
      <span id="admin-count" class="admin-count"></span>
    </div>
    <div class="admin-table-wrap">
    <table class="admin-table">
      <thead>
        <tr>
          <th>Title</th><th>Type</th><th>Year</th><th>Genre</th><th>Rating</th><th>Premium</th><th>Featured</th><th></th>
        </tr>
      </thead>
      <tbody id="admin-rows"></tbody>
    </table>
    </div>
    <p style="margin-top:20px; font-size:11.5px; color:var(--text-dim);">
      Imported title data is provided by <a href="https://www.themoviedb.org" target="_blank" style="color:var(--text-dim);">TMDB</a> and <a href="https://anilist.co" target="_blank" style="color:var(--text-dim);">AniList</a>. This product uses the TMDB API but is not endorsed or certified by TMDB.
    </p>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast" class="toast"></div>

<script src="admin.js"></script>
</body>
</html>
